[server]
port = 8000
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
runOnSave = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "developer"

[theme]
# WeatherTato Agricultural & Weather Dark Theme
primaryColor = "#22C55E"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "sans-serif"
